name: Release

# Creates the GitHub Release for a version tag. The sync from CodePress's
# monorepo pushes a tag v<version> on the commit where package.json's version
# changed, and that push starts this workflow. The notes are the version's
# CHANGELOG.md section and a link to it on npm. It is marked latest only when
# it is the highest version. A tag that already has a release is left alone.
# This file is synced from CodePress's monorepo; change it there.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to release, such as v0.2.1
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

# The release is created with this repository's own token; a deploy key, which
# is what pushes the tag, has no API access.
permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'; then
            echo "::error title=Not a version tag::\"$TAG\" is not a version tag such as v0.2.1."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        # The workflow's own commit (the tag, or main when run by hand, so an
        # older tag can be released too) and every tag: the notes come from
        # CHANGELOG.md at the tag, and the other tags tell whether it is the
        # highest version.
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release; nothing to do."
            exit 0
          fi
          node .github/scripts/release-notes.mjs "$TAG" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.env"
          . "$RUNNER_TEMP/release.env"
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$latest")
          if [ "$prerelease" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
